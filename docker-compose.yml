version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: paypulse-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: paypulse_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis In-Memory Store & Queue Broker
  redis:
    image: redis:7-alpine
    container_name: paypulse-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Backend Express Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: paypulse-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/paypulse_ai
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:8000
      RAZORPAY_KEY_ID: rzp_test_mock_paypulse
      RAZORPAY_KEY_SECRET: mock_secret_key_paypulse_12345
      RAZORPAY_WEBHOOK_SECRET: paypulse_webhook_secret_hmac_256
    ports:
      - "5000:5000"

  # 4. AI Microservice (FastAPI + Google Gemini)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: paypulse-ai-service
    restart: always
    environment:
      PORT: 8000
      HOST: 0.0.0.0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: gemini-2.5-flash
    ports:
      - "8000:8000"

  # 5. Frontend Client (Nginx + React Vite SPA)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: paypulse-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "5173:80"

volumes:
  postgres_data:
  redis_data:
